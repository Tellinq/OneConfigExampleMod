org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true
# Bloom doesn't support the configuration cache
# org.gradle.configuration-cache=true
org.gradle.configureondemand=true

# Change these values for your own mod.
mod.id=examplemod
mod.name=ExampleMod
mod.group=org.polyfrost
mod.version=1.0.0

minecraft_version=1.8.9
# The Minecraft versions your mod is compatible with, in Fabric's version range format
minecraft_version_range=1.8.9
feather_build=2
fabric_loader_version=0.19.5
oneconfig_version=1.6.0

# Modrinth project ID. Publishing is a dry run until this and your token are set.
publish.modrinth=
