org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true
# Bloom doesn't support the configuration cache
# org.gradle.configuration-cache=true
org.gradle.configureondemand=true

# Change these values for your own mod.
mod.id=examplemod
mod.name=ExampleMod
mod.group=org.polyfrost
mod.version=1.0.0

minecraft_version=26.3
# The Minecraft versions your mod is compatible with, in Fabric's version range format
minecraft_version_range=~26.3
fabric_loader_version=0.19.5
fabric_api_version=0.160.3+26.3
oneconfig_version=1.6.0

# Modrinth/CurseForge project IDs. Publishing is a dry run until these and your tokens are set.
publish.modrinth=
publish.curseforge=
